apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: school-frontend
  template:
    metadata:
      labels:
        app: school-frontend
    spec:
      containers:
      - name: react-ui
        image: docker.io/yourusername/school-frontend:poc
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: school-frontend